<!DOCTYPE html>
<head>
    <title>Michael Jackson Clicker</title>
    <meta property="og:title" content="michael jackson clicker">
	<meta name="twitter:title" content="michael jackson clicker">
	<meta property="og:description" content="hee hee">
	<meta name="twitter:description" content="hee hee">
	<meta name="description" content="hee hee">
    <meta property="og:url" content="https://cuzsie.github.io/mjclicker">
	<meta name="twitter:url" content="https://cuzsie.github.io/mjclicker">

    <style>
        body {
            background-color: black;
        }

        #mj {      
            width: 250px;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>

    <script defer>
        let rotation = 0;
        let sound = 1;
        
        function flip()
        {
            rotation = (rotation + 90) % 360;
            let mj = document.getElementById("mj");
            mj.style.transform = `rotate(${rotation}deg)`;

            sound = (sound + 1) % 2;

            new Audio(`/assets/audio/mj/he${sound}.mp3`).play();
        }
    </script>
</head>
<body>
    <div class="container">
        <img id="mj" src="/assets/images/mj.png" onclick="flip()">    
    </div>
</body>
